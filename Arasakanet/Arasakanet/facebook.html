<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta charset="UTF-8">
        <meta http-equiv="X-UA-Compatible" content="ie=edge">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="icon" type="image/Arasaka" href="img/facelogo.png">
        <title>Facebook</title> 
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="css/face.css">
<title>Facebook - Entrar ou Cadastrar-se</title>

</head>
<body>
  <div class="page">

    <div class="left">
      <svg class="fb-logo" viewBox="0 0 36 36" fill="none">
        <circle cx="18" cy="18" r="18" fill="#1877F2" src="img/icon.jpg" alt="descrição da imagem" style="max-width: 100%; height: auto; display: block; margin: 15px 0; border-radius: 4px;">/>
        <path d="M25 18.06C25 13.6 21.42 10 17 10s-8 3.6-8 8.06c0 4.03 2.93 7.37 6.75 7.94v-5.62h-2.03v-2.32h2.03v-1.77c0-2.01 1.2-3.13 3.03-3.13.88 0 1.8.16 1.8.16v1.98h-1.02c-1 0-1.31.62-1.31 1.26v1.5h2.23l-.36 2.32h-1.87V26c3.82-.57 6.75-3.91 6.75-7.94z" fill="#fff"/>
      </svg>

      <div class="collage" aria-hidden="true">
        <div class="emoji-badge">😄</div>
        <div class="card card-clock">🕐 16:45</div>

        <div class="card card-main">
          <div class="bar"></div>
          <div class="card-main"> 
            <div class="bar"></div>
          <img src="img/MARK.png" alt="" class="card-photo-main">
          </div>
        </div>

        <div class="card card-photo1"><div class="icon-chip">📷</div></div>
        <div class="card card-photo2">
          <div class="inner">
            <div class="stripe"></div>
            <div class="cup"></div>
          </div>
        </div>

        <div class="heart">❤️</div>
        <div class="dots"><span></span><span></span><span></span></div>
        <div class="avatar"></div>
      </div>

      <h1 class="cyberfont">Explore as coisas que <span class="accent">você</span> ama.</h1>
    </div>

    <div class="right">
      <div class="form-wrap">
        <h1>Entrar no Facebook</h1>
        <form>
          <input class="input" type="text" placeholder="Email ou número de celular">
          <input class="input" type="password" placeholder="Senha">
          <button class="btn-primary" type="submit">Entrar</button>
        </form>
        <a class="forgot" href="#">Esqueceu a senha?</a>
        <hr class="divider">
        <a class="btn-secondary" href="#">Criar nova conta</a>
        

        <div class="meta-footer">
          <svg width="20" height="20" viewBox="0 0 40 40" fill="none">
            <path d="M8 20c0-6 3-11 8-11 3 0 5 2 7 5 2-3 4-5 7-5 5 0 8 5 8 11s-3 11-8 11c-3 0-5-2-7-5-2 3-4 5-7 5-5 0-8-5-8-11z" stroke="#8a8d91" stroke-width="2.2"/>
          </svg>
          Meta
        </div>
      </div>
    </div>
    <div class="bottom-tagline"><a class="btn-secondary" href="index.html">De volta ao Lobby</a></div>

  </div>
</body>
</html>
