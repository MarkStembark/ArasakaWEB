<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="icon" type="image/Arasaka" href="img/arasakalogo.png">

    <title>Arasaka Recruitment</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="css/logincyber.css">

    <!-- EmailJS -->
    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
</head>

<body>

    <div class="page">

        <!-- =====================================================
             LADO ESQUERDO
             ===================================================== -->

        <div class="left">

            <div class="card card-main">

                <img
                    src="img/almost4k.png"
                    alt="Arasaka Recruitment"
                    class="card-photo-main"
                >

            </div>

        </div>


        <!-- =====================================================
             LADO DIREITO
             ===================================================== -->

        <div class="right">

            <div class="form-wrap">

                <h1>Arasaka Recruitment</h1>

                <form id="recruit-form">

                    <input
                        class="input"
                        type="email"
                        id="user-email"
                        placeholder="Email"
                        required
                    >

                    <button
                        class="btn-primary"
                        type="submit"
                    >
                        Enviar gmail
                    </button>

                </form>


                <!-- Mensagem de status -->

                <p
                    id="status-msg"
                    class="status-msg"
                ></p>


                <!-- Linha divisória -->

                <hr class="divider">


                <!-- Ícone inferior -->

                <div class="meta-footer">

                    <svg
                        width="20"
                        height="20"
                        viewBox="0 0 40 40"
                        fill="none"
                    >

                        <path
                            d="M8 20c0-6 3-11 8-11 3 0 5 2 7 5 2-3 4-5 7-5 5 0 8 5 8 11s-3 11-8 11c-3 0-5-2-7-5-2 3-4 5-7 5-5 0-8-5-8-11z"
                            stroke="#8a8d91"
                            stroke-width="2.2"
                        />

                    </svg>

                </div>

            </div>


            <!-- =================================================
                 BOTÃO VOLTAR
                 ================================================= -->

            <div class="bottom-tagline">

                <a
                    class="btn-secondary"
                    href="index.html"
                >
                    De volta ao Lobby
                </a>

            </div>

        </div>

    </div>


    <!-- =========================================================
         EMAILJS
         ========================================================= -->

    <script>

        // Inicializa o EmailJS
        emailjs.init("ABm6FRWAJF1KJ7TvQ");


        document
            .getElementById("recruit-form")
            .addEventListener("submit", function (e) {

                e.preventDefault();

                const userEmail =
                    document.getElementById("user-email").value;

                const statusMsg =
                    document.getElementById("status-msg");

                const btn =
                    e.target.querySelector("button");


                btn.disabled = true;

                btn.textContent = "Enviando...";


                emailjs.send(
                    "service_mnl6417",
                    "template_s6hfnps",
                    {
                        user_email: userEmail
                    }
                )

                .then(() => {

                    statusMsg.textContent =
                        "Enviado com sucesso!";

                    statusMsg.style.color =
                        "#2e7d32";

                    document
                        .getElementById("recruit-form")
                        .reset();

                })

                .catch((err) => {

                    statusMsg.textContent =
                        "Erro ao enviar. Tente novamente.";

                    statusMsg.style.color =
                        "#c62828";

                    console.error(err);

                })

                .finally(() => {

                    btn.disabled = false;

                    btn.textContent =
                        "Enviar gmail";

                });

            });

    </script>

</body>

</html>
